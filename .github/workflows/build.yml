# Build and link the four programs from a plain checkout: the tracked tree is all the build needs
# (no raw/; src/<prog>/data.c holds the original's data, see docs/notes/raw_free_build.md).
name: build

on:
  # (branches: a pushed PR branch would otherwise run twice, once for the push and once for the PR)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # UCRT64 gcc compiles the i386 objects (-m32); the i686 toolchain links them (build/Makefile)
          # (diffutils: cmp, which build/Makefile uses to rewrite an object's .flags file only when the flags change)
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            mingw-w64-i686-gcc
            mingw-w64-i686-zlib

      - name: The build must not need raw/
        run: test ! -e raw

      - name: Compile
        run: make -C build -j4

      - name: Link
        run: make -C build link

      - uses: actions/upload-artifact@v4
        with:
          name: grim-decomp-binaries
          path: |
            build/obj/GRIMFANDANGO.EXE/grimfandango.exe
            build/obj/LUA.DLL/lua.dll
            build/obj/IMUSE.DLL/imuse.dll
            build/obj/CHORE.DLL/chore.dll
            build/obj/*/stubs.txt

  # The clean-room tests of grim_tools (github.com/klusark/grim-autorun, cleanroom/run.py decomp) on the programs built
  # above, compared with the original's log (cleanroom/expected/original.log). The tests make their own data: no game files.
  # Fails when a test differs from the original or crashes or hangs the rebuilt exe.
  cleanroom:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grim-decomp-binaries
          path: binaries

      - name: The four programs in one folder
        run: |
          New-Item -ItemType Directory decomp | Out-Null
          # (by path: the artifact's folders are named after the programs, CHORE.DLL/ ..., and a *.dll pattern matches them too)
          foreach ($f in "GRIMFANDANGO.EXE/grimfandango.exe", "LUA.DLL/lua.dll", "IMUSE.DLL/imuse.dll", "CHORE.DLL/chore.dll") {
            Copy-Item "binaries/$f" -Destination decomp -ErrorAction Stop
          }
          Get-ChildItem decomp

      - uses: actions/checkout@v4
        with:
          repository: klusark/grim-autorun
          path: grim_tools

      # (a virtual sound card: the runner has none, and without DirectSound the game stops at startup with "could not
      # initialize your hardware")
      - name: Audio device
        uses: LABSN/sound-ci-helpers@v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # (CR_VISIBLE: the windows on the runner's desktop, no offscreen.exe to build; the runner is slower than a desk machine)
      - name: Clean-room tests
        id: tests
        env:
          GRIM_DECOMP: ${{ github.workspace }}\decomp
          CR_VISIBLE: "1"
          CR_STALL: "30"
          CR_STARTUP: "180"
        run: |
          "grim_tools: $(git -C grim_tools rev-parse --short HEAD) $(git -C grim_tools log -1 --format=%s)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          python grim_tools/cleanroom/run.py decomp 2>&1 | Tee-Object cleanroom.txt
          $rc = $LASTEXITCODE
          Add-Content $env:GITHUB_STEP_SUMMARY "### Clean-room tests`n``````"
          Get-Content cleanroom.txt | Where-Object { $_ -match '^==== |REGRESSION|tests differ|crashed or hung|SUMMARY|^decomp:' } |
            ForEach-Object { if ($_.Length -gt 400) { $_.Substring(0, 400) + " ..." } else { $_ } } |
            Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY "``````"
          exit $rc

      # (the PR comment, from the output: the tests that fail and what differs; the job comment posts it)
      - uses: actions/checkout@v4
        if: always() && github.event_name == 'pull_request'
        with:
          path: self
          sparse-checkout: .github/scripts

      - name: PR comment
        if: always() && github.event_name == 'pull_request'
        run: |
          python self/.github/scripts/cleanroom_comment.py cleanroom.txt "${{ steps.tests.outcome }}" `
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" comment.md

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: cleanroom-comment
          path: comment.md
          if-no-files-found: ignore

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanroom-logs
          path: |
            cleanroom.txt
            grim_tools/cleanroom/logs/
            grim_tools/cleanroom/run/decomp*/*.txt
            grim_tools/cleanroom/run/decomp*/*.log
            grim_tools/cleanroom/run/decomp*/*.ini
          if-no-files-found: ignore

  # A comment on the PR naming the clean-room tests that fail (and what differs), kept up to date: one comment per PR,
  # edited by each run. A passing run only edits it (no new comment when nothing ever failed).
  # (a PR from a fork gets a read-only token: no comment then, the step summary has the same)
  comment:
    needs: [build, cleanroom]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cleanroom-comment

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BUILD: ${{ needs.build.result }}
          CLEANROOM: ${{ needs.cleanroom.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- grim-decomp cleanroom -->'
          if [ ! -s comment.md ]; then
            # (the tests did not run, or ended before writing the comment)
            if [ "$BUILD" != success ]; then what="the build failed ($BUILD): the clean-room tests did not run"
            else what="the clean-room tests job ended with $CLEANROOM before reporting the tests"; fi
            printf '%s\n### :x: Clean-room tests\n%s\n\n[Run and logs](%s)\n' "$marker" "$what" "$RUN_URL" > comment.md
          fi
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | tail -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md > /dev/null
            echo "updated comment $id"
          elif grep -q ':x:' comment.md; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null
            echo "posted a comment"
          else
            echo "the tests pass and there is no earlier comment: none posted"
          fi
